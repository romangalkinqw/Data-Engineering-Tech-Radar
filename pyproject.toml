[project]
name = "de-tech-radar"
version = "0.1.0"
description = "Lakehouse pipeline for tracking open-source data engineering technology trends"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dagster>=1.13.24",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "tzdata>=2026.3",
]

[project.scripts]
de-tech-radar = "de_tech_radar.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.24",
    "dagster-webserver>=1.13.24",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "de_tech_radar"
defs_module = "de_tech_radar.orchestration"
code_location_target_module = "de_tech_radar.orchestration.definitions"
code_location_name = "de-tech-radar"
